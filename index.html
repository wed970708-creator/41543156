<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人響應式網站</title>
    <!-- 引入 Chart.js 用於製作統計圖表 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* 5. 響應式網頁設計 (CSS RWD) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
        }

        /* 導覽列 */
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #1abc9c;
        }

        /* 主體容器 */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* 區塊樣式 */
        section {
            background: #fff;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            border-bottom: 2px solid #1abc9c;
            padding-bottom: 10px;
        }

        /* 3. 多媒體區塊 RWD 彈性佈局 */
        .media-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .media-item {
            width: 100%;
        }

        img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            object-fit: cover;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 比例 */
            height: 0;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 6px;
        }

        /* 4. 圖表區塊尺寸控制 */
        .chart-container {
            position: relative;
            margin: auto;
            height: 40vh;
            width: 80vw;
            max-width: 600px;
        }

        /* 頁尾 */
        footer {
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 1.5rem;
            margin-top: 40px;
        }

        /* RWD 斷點設定：當螢幕小於 768px 時切換為單欄佈局 */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
            }
            nav ul {
                margin-top: 10px;
            }
            .media-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- 導覽列 -->
    <header>
        <nav>
            <h1>我的個人網站</h1>
            <ul>
                <li><a href="#about">關於我</a></li>
                <li><a href="#media">最愛影音</a></li>
                <li><a href="#stats">統計圖表</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <!-- 關於我區塊 -->
        <section id="about">
            <h2>關於我 / 網頁簡介</h2>
            <p>歡迎來到我的響應式網頁！本網站採用現代化的 HTML5、CSS Grid 佈局以及 JavaScript 技術開發。不論您是使用電腦、平板還是手機，網頁內容都能完美適應您的螢幕尺寸。</p>
        </section>

        <!-- 3. 內嵌最喜歡的影片和照片 -->
        <section id="media">
            <h2>我最喜歡的照片與影片</h2>
            <div class="media-grid">
                <!-- 照片區塊 (可自行替換 src 網址) -->
                <div class="media-item">
                    <h3>精選照片</h3>
  
<img src="https://photo.s3.com.tw/look/Upload/BlogArticleImages/25892/20260225111707137_700_0_80.jpg" alt="照片">

                </div>
                <!-- 影片區塊 (可將 YouTube 網址中的代碼替換成您喜歡的影片) -->
                <div class="media-item">
                    <h3>最愛影片</h3>
                    <div class="video-container">
<iframe width="560" height="315" src="https://www.youtube.com/embed/1mIcMDDO90A?si=AADpcAwlvwNa6Hm6" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </section>

        <!-- 4. JavaScript 做出統計圖表 -->
        <section id="stats">
            <h2>JavaScript 數據統計圖表</h2>
           <!DOCTYPE html>
<html>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<body>

<div id="myPlot" style="width:100%;max-width:700px"></div>

<script>
const xArray = ["Italy", "France", "Spain", "USA", "Argentina"];
const yArray = [55, 49, 44, 24, 15];

const data = [{
  x:xArray,
  y:yArray,
  type:"bar",
  orientation:"v",
  marker: {color:"rgba(0,0,255,0.6)"}
}];

const layout = {title:"World Wide Wine Production"};

Plotly.newPlot("myPlot", data, layout);
</script>

</body>
</html>
